name: Weekly Fuzzing

on:
  schedule:
    # 每周日 UTC 00:00
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Rust nightly
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          cache: true
      
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      
      - name: Run lex fuzzer (10 min)
        run: cargo +nightly fuzz run lex -- -max_total_time=600
        working-directory: stage0
        continue-on-error: true
        id: fuzz_lex
      
      - name: Run parse fuzzer (10 min)
        run: cargo +nightly fuzz run parse -- -max_total_time=600
        working-directory: stage0
        continue-on-error: true
        id: fuzz_parse
      
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: stage0/fuzz/artifacts/
          retention-days: 90
      
      - name: Create issue on crash
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🐛 Fuzzing 发现崩溃';
            const body = `Fuzzing 在本周运行中发现了崩溃。\n\n` +
              `- **运行时间**: ${{ github.run_id }}\n` +
              `- **工作流**: Weekly Fuzzing\n\n` +
              `请检查 artifacts 中的崩溃输入。`;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'fuzzing']
            });
