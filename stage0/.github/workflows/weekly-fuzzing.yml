name: Weekly Fuzzing

on:
  schedule:
    # 每周日 UTC 00:00
    - cron: '0 0 * * 0'
  workflow_dispatch:  # 允许手动触发

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzzing Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust Nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz lexer (10 minutes)
        working-directory: stage0
        run: cargo +nightly fuzz run lex -- -max_total_time=600
        continue-on-error: true
        id: fuzz_lex

      - name: Fuzz parser (10 minutes)
        working-directory: stage0
        run: cargo +nightly fuzz run parse -- -max_total_time=600
        continue-on-error: true
        id: fuzz_parse

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: stage0/fuzz/artifacts/

      - name: Create issue on crash
        if: steps.fuzz_lex.outcome == 'failure' || steps.fuzz_parse.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Fuzzing discovered crash';
            const body = 'Weekly fuzzing run found crashes. Check artifacts for details.';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'fuzzing']
            });
